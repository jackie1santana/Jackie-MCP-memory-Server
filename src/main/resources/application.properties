spring.application.name=ChatGPT-MCP-Server
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.profiles.default=local

spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/memory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${POSTGRES_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.locations=classpath:db
spring.flyway.baseline-on-migrate=true

app.memory.enabled=true
app.mcp.db-admin.enabled=false
app.mcp.db-admin.allow-ddl=false
app.mcp.db-admin.default-query-limit=200
app.mcp.db-admin.max-query-limit=1000

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.example.chatgptmcpserver=INFO
