# Enable alongside railway: SPRING_PROFILES_ACTIVE=railway,oauth
app.mcp.oauth.enabled=true
app.mcp.public-base-url=${APP_MCP_PUBLIC_BASE_URL}
app.mcp.oauth.client-id=${MCP_OAUTH_CLIENT_ID}
app.mcp.oauth.client-secret=${MCP_OAUTH_CLIENT_SECRET}
app.mcp.oauth.redirect-uri=${MCP_OAUTH_REDIRECT_URI}
app.mcp.oauth.github-client-id=${GITHUB_OAUTH_CLIENT_ID}
app.mcp.oauth.github-client-secret=${GITHUB_OAUTH_CLIENT_SECRET}
app.mcp.oauth.github-owner=${MCP_GITHUB_OWNER:jackie1santana}
server.forward-headers-strategy=framework
management.endpoint.health.show-details=never
