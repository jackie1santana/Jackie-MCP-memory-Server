spring.config.activate.on-profile=railway

# Railway must bind to all interfaces and dynamic platform port.
server.address=0.0.0.0
server.port=${PORT:8080}

# Railway PostgreSQL variables are used when available.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://${PGHOST:127.0.0.1}:${PGPORT:5432}/${PGDATABASE:memory_db}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${POSTGRES_DB_PASSWORD:${PGPASSWORD:}}

# Require MCP auth by default in railway profile.
app.mcp.auth.enabled=${MCP_AUTH_ENABLED:true}
app.mcp.auth.header-name=${MCP_AUTH_HEADER_NAME:X-MCP-API-KEY}
app.mcp.auth.token=${MCP_AUTH_TOKEN:}
app.mcp.public-base-url=${APP_MCP_PUBLIC_BASE_URL:}

app.mcp.db-admin.enabled=${MCP_DB_ADMIN_ENABLED:false}
app.mcp.db-admin.allow-ddl=${MCP_DB_ADMIN_ALLOW_DDL:false}
app.mcp.db-admin.default-query-limit=${MCP_DB_ADMIN_DEFAULT_QUERY_LIMIT:200}
app.mcp.db-admin.max-query-limit=${MCP_DB_ADMIN_MAX_QUERY_LIMIT:1000}

